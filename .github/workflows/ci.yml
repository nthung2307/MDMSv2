name: MDMSv2 Continuous Integration (CI)

on:
  push:
    branches: [ "main", "master", "feature/**", "hotfix/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test-and-build:
    name: Backend .NET 8 Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Backend/AMR.sln

    - name: Build Solution
      run: dotnet build Backend/AMR.sln -c Release --no-restore

    - name: Run Backend Unit Tests (MSTest Suite)
      run: dotnet test Backend/Tests/MDMS.UnitTests/MDMS.UnitTests.csproj -c Release --no-build --verbosity normal

  frontend-test-and-build:
    name: Frontend React 18 Build & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './Frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Frontend Unit Tests
      run: npm test

    - name: Build Production Static Bundle
      run: npm run build:prod

  docker-compose-validation:
    name: Docker & Container Configuration Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Docker Compose Configuration
      run: docker compose config

